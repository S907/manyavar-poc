function thumb(s){const c=s.status==='understocked'?'#9f1d15':s.status==='idle-heavy'?'#573280':s.status==='overstocked'?'#8f5200':'#17603b';return `<svg width="38" height="38" viewBox="0 0 38 38" style="flex:none"><rect x="4" y="16" width="30" height="18" rx="2" fill="${c}22"/><path d="M4 16 l4 -8 h22 l4 8 z" fill="${c}"/><rect x="15" y="22" width="8" height="12" fill="${c}bb"/><rect x="8" y="20" width="5" height="4" fill="${c}55"/><rect x="25" y="20" width="5" height="4" fill="${c}55"/></svg>`}
function scard(s){const hot=s.fill>=99||s.status==='understocked';
  return `<div class="scard" data-id="${s.id}"><div style="display:flex;gap:11px;align-items:center;margin-bottom:2px">${thumb(s)}<div><h3 style="margin:0">${s.id}</h3><div class="city">${esc(s.city)} &middot; ${s.tier} &middot; ${regionCity[s.city]||''}</div></div></div>${pillOf(s)}
   <div class="meter ${hot?'hot':''}"><i style="width:${Math.min(100,s.fill)}%"></i></div>
   <div class="kv"><span class="k">Stock / capacity</span><b>${s.oh} / ${s.cap} &middot; ${s.fill}%</b></div>
   <div class="kv"><span class="k">Days of cover</span><b>${s.cover==null?'—':s.cover+'d'}</b></div>
   <div class="kv"><span class="k">Sells / day</span><b>${s.sell}</b></div>
   <div class="kv"><span class="k">Wants in</span><b style="color:var(--ok)">+${s.wants}</b></div>
   <div class="kv"><span class="k">Idle (180+ days)</span><b style="color:${s.aged>40?'var(--pur)':'inherit'}">${s.aged}</b></div></div>`}
function bindCards(){document.querySelectorAll(".scard").forEach(c=>c.onclick=()=>{SEL=c.dataset.id;TAB="store";route()})}

function command(){const list=scopedStores().slice().sort((a,b)=>score(b)-score(a));
  const un=list.filter(s=>s.status==='understocked').length,idleU=list.reduce((a,s)=>a+s.aged,0),wants=list.reduce((a,s)=>a+s.wants,0);
  title.textContent="Command Center";
  view.innerHTML=`<div class="tiles">
    <div class="tile"><div class="l">Stores in view</div><div class="v">${list.length}</div></div>
    <div class="tile"><div class="l">Understocked</div><div class="v" style="color:var(--bad)">${un}</div></div>
    <div class="tile"><div class="l">Shipments moving</div><div class="v" style="color:var(--accent)">${scopedShips().length}</div></div>
    <div class="tile"><div class="l">Idle units</div><div class="v" style="color:var(--pur)">${idleU.toLocaleString("en-IN")}</div></div>
    <div class="tile"><div class="l">Units wanted</div><div class="v" style="color:var(--ok)">${wants.toLocaleString("en-IN")}</div></div></div>
   <div class="row"><div>
     <div class="card"><h2>Needs attention first</h2>${list.slice(0,4).map(s=>`<div class="alert ${s.status==='understocked'?'bad':s.status==='idle-heavy'?'pur':'warn'}"><div><span class="ab">${s.id} &middot; ${esc(s.city)}</span> — ${s.status==='understocked'?`low stock, ${s.cover}d cover, wants +${s.wants}`:s.status==='idle-heavy'?`${s.aged} idle units sitting`:`fill ${s.fill}%`} <a class="back" style="margin:0" onclick="SEL='${s.id}';TAB='store';route()">Go to store &rarr;</a></div></div>`).join("")}</div>
     <div class="card"><h2>Live deliveries <span class="c">${scopedShips().length} moving</span></h2>${scopedShips().slice(0,4).map(s=>`<div class="kv"><span class="k">${s.frm} &rarr; ${s.to} &middot; ${s.units}&times; ${s.style_id}</span><b>ETA ${s.arrive}</b></div>`).join("")}<a class="back" style="margin-top:8px" onclick="TAB='deliveries';route()">Open the delivery board</a></div>
    </div><div>
     <div class="card"><h2>Exceptions <span class="c">${DATA.exceptions.problems.length}</span></h2>${DATA.exceptions.problems.slice(0,3).map(p=>`<div class="alert warn"><div>${esc(p.head)}</div></div>`).join("")}<a class="back" onclick="TAB='exceptions';route()">See all data problems</a></div>
     <div class="card"><h2>Store requests <span class="c">${DATA.demands.filter(d=>d.status==='pending').length} pending</span></h2>${DATA.demands.slice(0,3).map(d=>`<div class="kv"><span class="k">${d.store} wants ${d.qty}&times; ${d.style} ${d.size}</span><b style="color:${d.status==='accepted'?'var(--ok)':d.status==='rejected'?'var(--bad)':'var(--warn)'}">${d.status}</b></div>`).join("")}<a class="back" onclick="TAB='warehouse';route()">Go to warehouse board</a></div>
    </div></div>`;
}
function leaderboard(){const list=scopedStores().slice().sort((a,b)=>score(b)-score(a));
  title.textContent="Stores";
  const un=list.filter(s=>s.status==='understocked').length,idleU=list.reduce((a,s)=>a+s.aged,0),wants=list.reduce((a,s)=>a+s.wants,0);
  view.innerHTML=`<div class="tiles"><div class="tile"><div class="l">Stores</div><div class="v">${list.length}</div></div><div class="tile"><div class="l">Understocked</div><div class="v" style="color:var(--bad)">${un}</div></div><div class="tile"><div class="l">Idle units</div><div class="v" style="color:var(--pur)">${idleU.toLocaleString("en-IN")}</div></div><div class="tile"><div class="l">Units wanted</div><div class="v" style="color:var(--ok)">${wants.toLocaleString("en-IN")}</div></div></div>
   <div class="grid">${list.map(scard).join("")}</div>`;bindCards();
}
function store(){const s=DATA.stores.find(x=>x.id===SEL)||scopedStores()[0];
  title.textContent=s.id+" — "+s.city;
  const inbound=DATA.shipments.filter(x=>x.to===s.id),out=DATA.shipments.filter(x=>x.frm===s.id),idle=DATA.idle.filter(x=>x.store===s.id),mydem=DATA.demands.filter(d=>d.store===s.id);
  const target=Math.round(s.sell*coverDays),need=Math.max(0,target-s.oh);
  view.innerHTML=`<span class="back" onclick="TAB='leaderboard';route()">&larr; back to stores</span>
   <div class="row"><div>
    <div class="card"><h2>Health <span class="c">${s.status.replace('-',' ')}</span></h2>
     <div class="meter ${s.fill>=99?'hot':'cool'}"><i style="width:${Math.min(100,s.fill)}%"></i></div>
     <div class="kv"><span class="k">Stock now</span><b>${s.oh} / ${s.cap} units (${s.fill}%)</b></div>
     <div class="kv"><span class="k">After today's plan</span><b>${s.fill_after}%</b></div>
     <div class="kv"><span class="k">Days of cover</span><b>${s.cover==null?'—':s.cover+' days'}</b></div>
     <div class="kv"><span class="k">Selling speed</span><b>${s.sell} units/day</b></div>
     <div class="kv"><span class="k">Idle (180+ days)</span><b style="color:var(--pur)">${s.aged} units</b></div></div>
    <div class="card"><h2>Stock to hold</h2>
     <div class="seg" style="margin-bottom:12px">${[30,60,90].map(d=>`<button class="${coverDays===d?'on':''}" onclick="coverDays=${d};route()">${d} days</button>`).join("")}</div>
     <div class="kv"><span class="k">Target for ${coverDays} days</span><b>${target} units</b></div>
     <div class="kv"><span class="k">Has now</span><b>${s.oh} units</b></div>
     <div class="kv"><span class="k">Send to reach ${coverDays}d</span><b style="color:${need>0?'var(--accent)':'var(--ok)'}">${need>0?'+'+need+' units':'already covered'}</b></div></div>
    <div class="card"><h2>Idle / old stock here <span class="c">${idle.length} SKUs</span></h2>${idle.length?`<table class="tbl"><tr><th>Style</th><th>SKU</th><th>Units</th><th>Age</th></tr>${idle.slice(0,8).map(x=>`<tr><td>${x.style}</td><td>${x.sku}</td><td>${x.oh}</td><td>${x.age}d</td></tr>`).join("")}</table>`:'<div class="sub2">No stale stock here.</div>'}</div>
   </div><div>
    <div class="card"><h2>Incoming</h2>${inbound.length?inbound.map(x=>`<div class="kv"><span class="k">${x.frm} &middot; ${x.units}&times; ${x.style_id} (${x.sizes})</span><b>arrives ${x.arrive}</b></div>`).join(""):'<div class="sub2">Nothing inbound.</div>'}</div>
    <div class="card"><h2>Sending out</h2>${out.length?out.map(x=>`<div class="kv"><span class="k">&rarr; ${x.to} &middot; ${x.units}&times; ${x.style_id}</span><b>${x.dispatch}</b></div>`).join(""):'<div class="sub2">Nothing outbound.</div>'}</div>
    ${(can('load')||can('receive'))?`<div class="card"><h2>Update stock (manual)</h2><div class="sub2" style="margin-bottom:9px">Warehouse or store manager corrects the live count. In the deployed app this writes straight to the database.</div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">On hand <input id="ust" type="number" value="${s.oh}" style="width:100px"> / ${s.cap}<button class="btn p" onclick="updateStock('${s.id}')">Save</button></div></div>`:''}
    <div class="card"><h2>Raise a stock request</h2>${can('flag')?`<div style="display:flex;gap:8px;flex-wrap:wrap"><input id="fstyle" placeholder="Style e.g. KUR-04" style="flex:1;min-width:120px"><input id="fsize" placeholder="Size" style="width:84px"><input id="fqty" placeholder="Qty" style="width:74px" type="number"><button class="btn p" onclick="raiseFlag('${s.id}')">Request</button></div>`:`<div class="sub2">Switch View to Store Manager to raise a request.</div>`}
     ${mydem.length?`<div style="margin-top:12px">${mydem.map(d=>`<div class="kv"><span class="k">${d.qty}&times; ${d.style} ${d.size}</span><span class="chip" style="background:${d.status==='accepted'?'var(--okbg)':d.status==='rejected'?'var(--badbg)':'var(--warnbg)'};color:${d.status==='accepted'?'var(--ok)':d.status==='rejected'?'var(--bad)':'var(--warn)'}">${d.status}</span></div>`).join("")}</div>`:''}</div>
   </div></div>`;
}
window.updateStock=id=>{const s=DATA.stores.find(x=>x.id===id);const v=Math.max(0,+document.getElementById('ust').value||0);s.oh=v;s.fill=Math.round(v/s.cap*100);s.cover=s.sell>0.05?+(v/s.sell).toFixed(1):null;s.status=(s.cover!=null&&s.cover<12)?'understocked':(s.aged>s.oh*0.25&&s.oh>0)?'idle-heavy':(s.fill>=99)?'overstocked':'healthy';route();};
window.raiseFlag=id=>{const st=document.getElementById("fstyle").value||"KUR-04",sz=document.getElementById("fsize").value||"L",q=+document.getElementById("fqty").value||50;const s=DATA.stores.find(x=>x.id===id);DATA.demands.unshift({id:"REQ-"+(DATA.demands.length+1).toString().padStart(3,"0"),store:id,city:s.city,region:regionCity[s.city],am:s.am,style:st,size:sz,qty:q,status:"pending",reason:"Raised on-site by store manager"});route();};

// ---- DELIVERIES ----
function arc(s){const mx=(s.fx+s.tx)/2,my=(s.fy+s.ty)/2,dx=s.tx-s.fx,dy=s.ty-s.fy,len=Math.hypot(dx,dy)||1;const h=(s.id.charCodeAt(2)*7+s.id.charCodeAt(3))%5;const off=(55+h*26)*(s.id.charCodeAt(2)%2?1:-1);return{cx:mx+(-dy/len)*off,cy:my+(dx/len)*off}}
function bez(s,t){const{cx,cy}=arc(s),u=1-t;return{x:u*u*s.fx+2*u*t*cx+t*t*s.tx,y:u*u*s.fy+2*u*t*cy+t*t*s.ty}}
function deliveries(){title.textContent="Live Deliveries";
  view.innerHTML=`<div class="row"><div>
    <div class="card" style="padding:13px"><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:11px;align-items:center">
      <button class="btn g" id="play">Simulate movement</button>
      ${can('load')?`<button class="btn" id="loadall">Load all</button><button class="btn" id="dispatchall">Dispatch all</button>`:''}
      <span class="legend" style="margin:0"><span><span class="dot" style="background:#2f6db4"></span>Warehouse &rarr; store</span><span><span class="dot" style="background:#8a5a1a"></span>Store &rarr; store</span></span></div>
     <svg class="map" viewBox="0 0 1000 680" id="svg"></svg>
     <div class="legend">The 6 cities + the Kolkata warehouse, placed by geography. A real Google/Leaflet map runs in the live app; here it is a clean schematic.</div></div>
    </div><div><div class="card"><h2>Shipments <span class="c" id="shipn"></span></h2><div id="shiplist"></div></div></div></div>`;
  if(can('load')){document.getElementById("loadall").onclick=()=>{scopedShips().forEach(s=>{if(s.status==='created')s.status='loading'});draw()};document.getElementById("dispatchall").onclick=()=>{scopedShips().forEach(s=>{if(s.status==='created'||s.status==='loading'){s.status='in_transit';s.halt=false}});draw()};}
  document.getElementById("play").onclick=()=>{playing=!playing;document.getElementById("play").textContent=playing?'Halt all':'Simulate movement';playing?start():stop()};
  draw();
}
function shipStep(s){const i=s.flag?99:LIFE.indexOf(s.status);return `<div class="step">${LIFE.map((l,j)=>`<div class="s ${s.flag&&j>=2?'bad':j<i?'done':j===i?'cur':''}">${l.replace('_',' ')}</div>`).join("")}<div class="s ${s.halt?'halt':''}">halted</div></div>`}
function fallbackFor(s){const near=DATA.stores.filter(x=>x.id!==s.to&&x.city===s.city&&x.oh>x.wants+20)[0]||DATA.stores.filter(x=>x.id!==s.to&&x.oh>x.wants+40).sort((a,b)=>b.oh-a.oh)[0];return near?`Fallback source: <b>${near.id} (${near.city})</b> holds ${near.oh} units and can cover ${s.to}.`:"No nearby store can cover — hold for next warehouse run.";}
function controls(s){if(!can('load')&&!can('receive'))return `<div class="sub2">Read-only — switch View to Warehouse to run shipments.</div>`;const b=(l,fn,c="")=>`<button class="btn sm ${c}" onclick="${fn}">${l}</button>`;let o=[];
  if(can('load')){if(s.status==='created')o.push(b('Start loading',`setS('${s.id}','loading')`,'p'));
    else if(s.status==='loading')o.push(b('Dispatch',`setS('${s.id}','in_transit')`,'p'));
    else if(s.status==='in_transit'){if(s.halt)o.push(b('Resume',`resume('${s.id}')`,'ok'));else o.push(b('Halt',`halt('${s.id}')`));o.push(b('Arrived &middot; unload',`setS('${s.id}','unloading')`));o.push(b('Inject delay',`delay('${s.id}')`,'no'));}
    else if(s.status==='unloading')o.push(b('Mark delivered',`setS('${s.id}','delivered')`,'g'));}
  if(can('receive')&&s.status==='unloading')o.push(b('Confirm received',`setS('${s.id}','delivered')`,'ok'));
  if(s.flag)o.push(b('Resolve',`resolve('${s.id}')`,'ok'));
  return o.join(" ");}
function drawList(){const ships=scopedShips();document.getElementById("shipn").textContent=ships.length;
  document.getElementById("shiplist").innerHTML=ships.map(s=>`<div class="shp ${s.flag?'flag':s.halt?'halt':''}">
   <div class="hd"><span class="rt">${s.frm} &rarr; ${s.to}</span><span class="sub2" style="margin-left:auto">${s.units}&times; ${s.style_id} &middot; ${s.sizes}</span></div>
   <div class="sub2">${inr(s.value)} &middot; dispatch ${s.dispatch} &middot; ETA ${s.arrive} (${s.lead}d)${s.halt?' &middot; <b style="color:var(--warn)">HALTED</b>':''}</div>
   ${shipStep(s)}${s.flag?`<div class="fallback">Running late. ${fallbackFor(s)}</div>`:""}
   <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">${controls(s)}</div></div>`).join("");}
function draw(){drawMap();drawList()}
function truckSvg(x,y,col){return `<g transform="translate(${x-11},${y-7})"><rect x="0" y="0" width="15" height="11" rx="2" fill="${col}"/><rect x="15" y="3" width="7" height="8" rx="1.5" fill="${col}"/><circle cx="5" cy="13" r="2.4" fill="#2a2a2a"/><circle cx="18" cy="13" r="2.4" fill="#2a2a2a"/></g>`}
function drawMap(){const svg=document.getElementById("svg");if(!svg)return;
  let bg=`<text class="rlabel" x="300" y="66">UP NORTH</text><text class="rlabel" x="620" y="56">BIHAR EAST</text><text class="rlabel" x="300" y="604">KARNATAKA SOUTH</text>`,routes="",trucks="",nodes="";
  scopedShips().forEach(s=>{const{cx,cy}=arc(s),cls=s.kind==="WAREHOUSE_TO_STORE"?"w":"s",moving=s.status==='in_transit'&&!s.halt,d=`M${s.fx},${s.fy} Q${cx},${cy} ${s.tx},${s.ty}`;
    routes+=`<path class="route ${cls}" d="${d}" ${s.flag?'stroke="#9f1d15" opacity=".6"':''}/>`;
    if(moving)routes+=`<path class="flow ${cls}" d="${d}"/>`;
    if(s.status==='in_transit'||s.status==='loading'||s.status==='unloading'){const t=s.status==='loading'?0.03:s.status==='unloading'?0.97:s.progress,p=bez(s,t);trucks+=truckSvg(p.x,p.y,s.flag?'#9f1d15':s.halt?'#8f5200':cls==='w'?'#2f6db4':'#8a5a1a');}});
  nodes+=`<g><rect x="${DATA.warehouse.x-16}" y="${DATA.warehouse.y-14}" width="32" height="28" rx="4" fill="#571c25"/><path d="M${DATA.warehouse.x-16} ${DATA.warehouse.y-14} l16 -9 l16 9" fill="none" stroke="#571c25" stroke-width="3"/><text x="${DATA.warehouse.x}" y="${DATA.warehouse.y+32}" text-anchor="middle" font-size="13" font-weight="700" fill="#571c25">WH-KOL</text></g>`;
  DATA.stores.forEach(s=>{if(role().scope&&!role().scope.includes(s.id))return;const col=s.status==='understocked'?'#9f1d15':s.status==='idle-heavy'?'#573280':s.status==='overstocked'?'#8f5200':'#17603b';nodes+=`<g style="cursor:pointer" onclick="SEL='${s.id}';TAB='store';route()"><circle cx="${s.x}" cy="${s.y}" r="10" fill="${col}" stroke="#fff" stroke-width="2"><title>${s.id} ${s.city} &middot; fill ${s.fill}% &middot; cover ${s.cover||'—'}d</title></circle><text x="${s.x}" y="${s.y-15}" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3a332c">${s.id}</text></g>`;});
  svg.innerHTML=bg+routes+nodes+trucks;}
window.setS=(id,st)=>{const s=DATA.shipments.find(x=>x.id===id);s.status=st;s.halt=false;if(st==='in_transit'&&s.progress>=1)s.progress=0;if(st==='delivered')s.progress=1;draw()};
window.delay=id=>{DATA.shipments.find(x=>x.id===id).flag=true;draw()};
window.resolve=id=>{DATA.shipments.find(x=>x.id===id).flag=false;draw()};
window.halt=id=>{DATA.shipments.find(x=>x.id===id).halt=true;draw()};
window.resume=id=>{DATA.shipments.find(x=>x.id===id).halt=false;draw()};
function start(){stop();timer=setInterval(()=>{let done=false;scopedShips().forEach(s=>{if(s.status==='in_transit'&&!s.flag&&!s.halt){s.progress+=0.0035;if(s.progress>=1){s.progress=1;s.status='unloading';done=true}}});drawMap();if(done)drawList();},120)}
function stop(){if(timer)clearInterval(timer);timer=null}

// ---- PERFORMANCE ----
function performance(){title.textContent="Performance";
  const stores=scopedStores();const byR={};
  stores.forEach(s=>{const r=regionCity[s.city]||'—';(byR[r]=byR[r]||[]).push(s)});
  const regionRows=Object.entries(byR).map(([r,ss])=>({r,n:ss.length,cover:(ss.reduce((a,s)=>a+(s.cover||0),0)/ss.length).toFixed(1),un:ss.filter(s=>s.status==='understocked').length,idle:ss.reduce((a,s)=>a+s.aged,0),wants:ss.reduce((a,s)=>a+s.wants,0),oh:ss.reduce((a,s)=>a+s.oh,0)}));

    <div class="tile"><div class="l">Styles short at WH</div><div class="v" style="color:var(--warn)">21</div><div class="l">served lowest-cover first</div></div>
    <div class="tile"><div class="l">Stores understocked</div><div class="v" style="color:var(--bad)">${stores.filter(s=>s.status==='understocked').length}</div></div>
    <div class="tile"><div class="l">Idle units held</div><div class="v" style="color:var(--pur)">${stores.reduce((a,s)=>a+s.aged,0).toLocaleString("en-IN")}</div></div></div>
   <div class="card"><h2>Area-wise performance</h2>
     <table class="tbl"><tr><th>Region</th><th>Stores</th><th>Avg cover</th><th>Understocked</th><th>Idle units</th><th>Units wanted</th></tr>
     ${regionRows.map(r=>`<tr><td><b>${r.r}</b></td><td>${r.n}</td><td>${r.cover}d</td><td style="color:${r.un?'var(--bad)':'inherit'}">${r.un}</td><td style="color:var(--pur)">${r.idle}</td><td style="color:var(--ok)">+${r.wants}</td></tr>`).join("")}</table></div>
   <div class="card"><h2>Store-wise performance</h2>
     <table class="tbl"><tr><th>Store</th><th>Region</th><th>Fill</th><th>Cover</th><th>Sells/day</th><th>Wants</th><th>Idle</th><th>Status</th></tr>
     ${storeRows.map(s=>`<tr class="${s.status==='understocked'?'hl':''}" style="cursor:pointer" onclick="SEL='${s.id}';TAB='store';route()"><td><b>${s.id}</b></td><td>${regionCity[s.city]}</td><td>${s.fill}%</td><td>${s.cover||'—'}d</td><td>${s.sell}</td><td style="color:var(--ok)">+${s.wants}</td><td style="color:var(--pur)">${s.aged}</td><td>${pillOf(s).replace('margin-top:9px','')}</td></tr>`).join("")}</table>
     <div class="legend">Per style &amp; size demand sits in Forecast. To fix a gap: open a store, pick 30/60/90-day cover, and the board tells you the exact units to send.</div></div>`;

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:11,attribution:'&copy; OpenStreetMap'}).addTo(map);
  const wh=DATA.warehouse,stById={};DATA.stores.forEach(s=>stById[s.id]=s);const pts=[];recMovers=[];recLayers={};
  if(wh.lat){L.circleMarker([wh.lat,wh.lon],{radius:10,color:'#fff',weight:2,fillColor:'#571c25',fillOpacity:1}).addTo(map).bindTooltip('WH-KOL &middot; warehouse',{direction:'top'});pts.push([wh.lat,wh.lon]);}
  const seen={};
  recs.forEach(r=>{const d=stById[r.to];const src=r.from===wh.id?wh:stById[r.from];if(!d||!d.lat||!src||!src.lat)return;
    const a=[src.lat,src.lon],b=[d.lat,d.lon],col=r.kind==='STORE_TO_STORE'?'#8a5a1a':'#2f6db4';
    const line=L.polyline([a,b],{color:col,weight:2,opacity:.45,dashArray:'5 8'}).addTo(map);line.on('click',()=>focusRec(r.key));recLayers[r.key]={line,a,b};
    if(!seen[r.to]){seen[r.to]=1;L.circleMarker(b,{radius:7,color:'#fff',weight:2,fillColor:'#9f1d15',fillOpacity:.95}).addTo(map).bindTooltip(r.to+' &middot; short',{direction:'top'}).on('click',()=>focusRec(r.key));pts.push(b);}
    recMovers.push({a,b,t:Math.random(),m:L.circleMarker(a,{radius:5,color:'#fff',weight:2,fillColor:col,fillOpacity:1}).addTo(map)});});
  if(pts.length)map.fitBounds(pts,{padding:[34,34]});
  _recmap=map;setTimeout(()=>{try{map.invalidateSize()}catch(e){}},130);
  recTimer=setInterval(()=>{recMovers.forEach(o=>{o.t+=0.012;if(o.t>1)o.t=0;o.m.setLatLng([o.a[0]+(o.b[0]-o.a[0])*o.t,o.a[1]+(o.b[1]-o.a[1])*o.t]);});},70);
}
window.approveRec=key=>{const[to,style,size]=key.split('|');const r=buildRecs().find(x=>x.key===key);if(!r){recApproved[key]=1;return route();}
  const sd=DATA.stores.find(x=>x.id===to)||{};const src=DATA.stores.find(x=>x.id===r.from);const fx=r.from===DATA.warehouse.id?DATA.warehouse.x:(src?src.x:DATA.warehouse.x),fy=r.from===DATA.warehouse.id?DATA.warehouse.y:(src?src.y:DATA.warehouse.y);
  DATA.shipments.unshift({id:"R"+Object.keys(recApproved).length+""+DATA.shipments.length,frm:r.from,to,units:r.need,value:r.need*4500,kind:r.kind,style:style,style_id:style,sizes:size,dispatch:DATA.today,arrive:DATA.today,lead:3,reason:"Approved recommendation",fx,fy,tx:sd.x,ty:sd.y,progress:0,status:"created",flag:false,halt:false});
  recApproved[key]=1;route();};
window.dismissRec=key=>{recApproved[key]=1;route();};
window.approveAll=()=>{buildRecs().forEach(r=>{recApproved[r.key]=1;});route();};

const PAGES={command,leaderboard,store,deliveries,recs:recommendations,performance,insights,forecast,idle,warehouse,exceptions,status};
function route(){stop();stopRecAnim();playing=false;renderNav();document.getElementById("foot").textContent="Stock as of "+DATA.today+" · demo data from the live engine";(PAGES[TAB]||command)();toggleMenu(false);window.scrollTo(0,0)}
document.getElementById("nav").onclick=e=>{const a=e.target.closest("[data-t]");if(a){TAB=a.dataset.t;route()}};
document.getElementById("role").onchange=()=>{SEL=null;if(TAB==='store')TAB='leaderboard';route()};
function toggleMenu(open){document.getElementById("app").classList.toggle("open",open)}
(function(){const tt=document.createElement('div');tt.id='tt';document.body.appendChild(tt);document.addEventListener('mouseover',e=>{const t=e.target.closest('[data-tip]');if(t){tt.innerHTML=t.getAttribute('data-tip');tt.style.display='block';}});document.addEventListener('mousemove',e=>{if(tt.style.display==='block'){let x=e.clientX+14,y=e.clientY+16;const w=tt.offsetWidth,hh=tt.offsetHeight;if(x+w>innerWidth-8)x=e.clientX-w-14;if(y+hh>innerHeight-8)y=e.clientY-hh-16;tt.style.left=x+'px';tt.style.top=y+'px';}});document.addEventListener('mouseout',e=>{if(e.target.closest('[data-tip]'))tt.style.display='none';});})();
route();
fetch('/api/board').then(r=>r.ok?r.json():null).then(d=>{if(d&&d.stores){DATA=d;DATA.shipments.forEach(s=>{s.progress=0;s.status='created';s.flag=false;s.halt=false});recApproved={};route();}}).catch(()=>{});
</script></body></html>

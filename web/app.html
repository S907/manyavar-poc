<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock Mover · roles</title>
<style>
  :root{--ink:#1d1b19;--mute:#6f6a63;--line:#e4ddd3;--bg:#faf6f0;--card:#fff;--accent:#b4541c;--ok:#1f7a4d;--warn:#b26a00;--bad:#b3261e;--chip:#f3e8db}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
  header{background:#fff;border-bottom:1px solid var(--line);padding:12px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  h1{font:600 19px/1.2 Georgia,serif;margin:0}h1 span{color:var(--accent)}
  .who{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:13px}
  .role{padding:3px 10px;border-radius:999px;background:var(--chip);font-weight:600;text-transform:capitalize}
  .badge{padding:5px 11px;border-radius:999px;font-weight:600;font-size:12.5px}
  .badge.ok{background:#e4f3ea;color:var(--ok)}.badge.bad{background:#fde8e6;color:var(--bad)}
  main{max-width:1200px;margin:0 auto;padding:16px 20px 60px}
  .btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit;color:var(--ink)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .btn.sm{padding:3px 9px;font-size:12.5px}.btn:disabled{opacity:.45;cursor:default}
  nav{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 14px}
  nav button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;font:inherit}
  nav button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
  .panel h2{font:600 16px Georgia,serif;margin:0 0 10px}
  table{width:100%;border-collapse:collapse}td,th{padding:7px 10px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);background:#fcf9f5}
  td.n{text-align:right;white-space:nowrap}
  select,input{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}.tile b{display:block;font:600 20px Georgia,serif}.tile small{color:var(--mute)}
  .chip{display:inline-block;background:var(--chip);border-radius:6px;padding:1px 8px;font-size:11.5px;white-space:nowrap}
  .st{font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px}
  .st.proposed{background:#eee6da;color:#6f6a63}.st.approved{background:#e9eef7;color:#2f4b7a}.st.approved_pending_ho{background:#fbeccd;color:#8a5a00}
  .st.picked{background:#efe6f5;color:#6a3b8a}.st.dispatched{background:#e0f0e6;color:#1f7a4d}.st.received{background:#d7f0dd;color:#145c37}.st.rejected{background:#f5e0de;color:#b3261e}
  .reason{color:#3d3934;max-width:460px;font-size:12.5px}
  .login{max-width:520px;margin:8vh auto}.login .panel{padding:22px}
  .urow{display:flex;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:8px;margin-bottom:7px;cursor:pointer}
  .urow:hover{border-color:var(--accent)}.urow .role{margin-left:auto}
  .small{font-size:12.5px;color:var(--mute)}.right{margin-left:auto}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .scopebox{display:flex;flex-wrap:wrap;gap:4px;max-width:420px}
  .scopebox label{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:2px 6px;cursor:pointer}
  .group{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden}
  .ghead{display:flex;gap:10px;align-items:center;padding:9px 12px;cursor:pointer;flex-wrap:wrap}.ghead h3{margin:0;font:600 14px Georgia,serif}
  .pill{font-size:11px;color:var(--mute)}
  .hide{display:none}
  .aud{font-size:12.5px;padding:4px 0;border-top:1px solid var(--line)}
</style>
</head>
<body>
<div id="app"></div>
<script>
const WAREHOUSE_FALLBACK="WH-KOL";
const ROLES=["super_admin","merchandiser","area_manager","store_manager","warehouse"];
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rs=n=>"₹"+Number(n).toLocaleString("en-IN");
const uid=()=>"U"+Math.random().toString(36).slice(2,7);
const LS={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set:(k,v)=>localStorage.setItem(k,JSON.stringify(v))};
let D=null,C=null,S={users:[],status:{},audit:[],session:null,settings:{snapshot_source:"weekly"}};

function load(){S.users=LS.get("sm_users",null);S.status=LS.get("sm_status",{});S.audit=LS.get("sm_audit",[]);S.session=LS.get("sm_session",null);S.settings=LS.get("sm_settings",{snapshot_source:"weekly"})}
function persist(){LS.set("sm_users",S.users);LS.set("sm_status",S.status);LS.set("sm_audit",S.audit);LS.set("sm_session",S.session);LS.set("sm_settings",S.settings)}
function log(action,target,detail){S.audit.unshift({at:new Date().toISOString(),user_id:S.session,action,target,detail});persist()}

function seedUsers(){
  if(S.users)return;
  const u=[{user_id:"ADMIN",name:"Super Admin",email:"admin@manyavar",role:"super_admin",active:true,scope:{type:"all"}},
           {user_id:"MERCH",name:"Head Office Merchandiser",email:"merch@manyavar",role:"merchandiser",active:true,scope:{type:"all"}},
           {user_id:"WH",name:"Warehouse Desk",email:"wh@manyavar",role:"warehouse",active:true,scope:{type:"warehouse"}}];
  (D.area_managers||[]).forEach(a=>u.push({user_id:a.area_manager_id,name:a.name,email:a.area_manager_id.toLowerCase()+"@manyavar",role:"area_manager",active:true,scope:{type:"stores",stores:a.stores.slice()}}));
  // one store manager for the first two stores as a demo
  (D.stores||[]).slice(0,2).forEach(s=>u.push({user_id:"SM-"+s.store_id,name:s.store_id+" Store Manager",email:s.store_id.toLowerCase()+"@manyavar",role:"store_manager",active:true,scope:{type:"stores",stores:[s.store_id]}}));
  S.users=u;persist();
}
function me(){return S.users.find(u=>u.user_id===S.session)||null}
function scopeStores(u){if(!u)return null;if(u.scope.type==="all"||u.scope.type==="warehouse")return null;return new Set(u.scope.stores||[])}
function statusOf(m){return S.status[m.move_id]||"proposed"}
function setStatus(m,st,label){S.status[m.move_id]=st;persist();log(st,m.move_id,label||`${m.from_loc}→${m.to_loc} ${m.units}× ${m.style_id}`)}

async function boot(){
  load();
  try{D=await (await fetch("data/moves.json",{cache:"no-store"})).json();C=await (await fetch("data/rule_check.json",{cache:"no-store"})).json();}
  catch(e){document.getElementById("app").innerHTML="<div class='login'><div class='panel'>Could not load data/moves.json. Run <code>python run_daily.py</code> first.</div></div>";return}
  if(!D.warehouse)D.warehouse=WAREHOUSE_FALLBACK;
  seedUsers();
  render();
}
function render(){S.session&&me()&&me().active?renderApp():renderLogin()}

/* ---------- login (pick a user = simulated sign-in) ---------- */
function renderLogin(){
  document.getElementById("app").innerHTML=`<div class="login"><div class="panel">
    <h2><span style="color:var(--accent)">Stock</span> Mover — sign in</h2>
    <div class="small" style="margin-bottom:12px">Pick a user. Each role sees only its own slice. (Demo stand-in for real login.)</div>
    ${S.users.filter(u=>u.active).map(u=>`<div class="urow" data-login="${u.user_id}"><div><b>${esc(u.name)}</b><div class="small">${esc(u.email)}</div></div><span class="role">${u.role.replace("_"," ")}</span></div>`).join("")}
    <div class="small" style="margin-top:10px">Data as of ${esc(D.today)} · ${D.moves.length} proposed moves</div>
  </div></div>`;
  document.querySelectorAll("[data-login]").forEach(el=>el.onclick=()=>{S.session=el.dataset.login;persist();TAB="overview";render()});
}

/* ---------- app shell ---------- */
let TAB="overview",GROUPOPEN={};
function renderApp(){
  const u=me();
  document.getElementById("app").innerHTML=`<header>
    <h1><span>Stock</span> Mover</h1>
    <span class="badge ${C.all_passed?"ok":"bad"}">${C.all_passed?"✓ rules pass":"✗ rules fail"}</span>
    <div class="who"><span>${esc(u.name)}</span><span class="role">${u.role.replace("_"," ")}</span><button class="btn sm" id="logout">Switch user</button></div>
  </header><main id="main"></main>`;
  document.getElementById("logout").onclick=()=>{S.session=null;persist();render()};
  const views={super_admin:adminView,merchandiser:merchView,area_manager:areaView,store_manager:storeView,warehouse:whView};
  (views[u.role]||merchView)(u);
}

/* ---------- shared: visible moves for a user ---------- */
function visibleMoves(u){
  const ss=scopeStores(u);
  return D.moves.filter(m=>{
    if(u.role==="warehouse")return m.from_loc===D.warehouse;
    if(ss)return ss.has(m.to_loc)||ss.has(m.from_loc);
    return true;
  });
}
/* transitions a user may apply to a move in its current state */
function actions(m,u){
  const st=statusOf(m),W=D.warehouse,a=[];
  const isMerch=u.role==="merchandiser"||u.role==="super_admin";
  if(st==="proposed"){
    if(isMerch)a.push(["approve","approved","Approve"]);
    else if(u.role==="area_manager")a.push(m.needs_approval?["approve","approved_pending_ho","Approve (needs HO)"]:["approve","approved","Approve"]);
    if(isMerch)a.push(["reject","rejected","Reject"]);
  }
  if(st==="approved_pending_ho"&&isMerch)a.push(["approve","approved","Sign off (HO)"]);
  if(st==="approved"){
    if(u.role==="warehouse"&&m.from_loc===W)a.push(["pick","picked","Mark picked"]);
    if(u.role==="store_manager"&&m.from_loc!==W&&(scopeStores(u)||new Set()).has(m.from_loc))a.push(["dispatch","dispatched","Mark dispatched"]);
  }
  if(st==="picked"&&u.role==="warehouse"&&m.from_loc===W)a.push(["dispatch","dispatched","Mark dispatched"]);
  if(st==="dispatched"&&u.role==="store_manager"&&(scopeStores(u)||new Set()).has(m.to_loc))a.push(["receive","received","Mark received"]);
  return a;
}
function doAction(id,st,label){const m=D.moves.find(x=>x.move_id===id);setStatus(m,st,label);renderApp()}
function stChip(st){return `<span class="st ${st}">${st.replace(/_/g," ")}</span>`}

function moveRow(m,u,showActions){
  const st=statusOf(m),acts=showActions?actions(m,u):[];
  return `<tr>
    <td><b>${m.from_loc} → ${m.to_loc}</b><br><span class="chip">${m.kind.replace(/_/g," ").toLowerCase()}</span> <span class="small">${m.move_id}</span></td>
    <td>${esc(m.style_name)} <span class="small">${m.style_id}</span><br><span class="small">${esc(m.sizes)}</span></td>
    <td class="n">${m.units}</td><td class="n">${rs(m.value_mrp)}${m.needs_approval?'<br><span class="small" style="color:var(--warn)">needs approval</span>':""}</td>
    <td class="n">${m.arrives_on}</td>
    <td>${stChip(st)}</td>
    <td class="reason">${esc(m.reason)}</td>
    <td class="n">${acts.map(a=>`<button class="btn sm" data-act="${a[0]}" data-id="${m.move_id}" data-st="${a[1]}" data-lb="${esc(a[2])}">${a[2]}</button>`).join(" ")||""}</td>
  </tr>`;
}
function wireActions(){document.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>doAction(b.dataset.id,b.dataset.st,b.dataset.lb))}
function groupByStore(moves){const g={};moves.forEach(m=>{const k=m.to_loc===D.warehouse?m.from_loc+" → warehouse":m.to_loc;(g[k]=g[k]||[]).push(m)});return g}

/* ---------- merchandiser / super-admin overview ---------- */
function problemsPanel(){const P=D.problems||[];const col={data:"#b26a00",stock:"#b3261e",supply:"#7a2f2f"};
  return P.length?`<div class="panel"><h2>Problems found</h2>${P.map(p=>`<div style="padding:5px 0;border-top:1px solid var(--line)"><span class="chip" style="background:${col[p.severity]||"#eee"};color:#fff">${p.severity}</span> <b>${esc(p.headline)}</b><div class="small">${esc(p.detail)}</div></div>`).join("")}</div>`:"";}
function tiles(moves){const u=moves.reduce((a,m)=>a+m.units,0),v=moves.reduce((a,m)=>a+m.value_mrp,0),cnt=st=>moves.filter(m=>statusOf(m)===st).length;
  return `<div class="tiles">
    <div class="tile"><b>${moves.length}</b><small>moves in view</small></div>
    <div class="tile"><b>${u.toLocaleString("en-IN")}</b><small>units</small></div>
    <div class="tile"><b>${rs(v)}</b><small>value</small></div>
    <div class="tile"><b>${cnt("proposed")}</b><small>awaiting approval</small></div>
    <div class="tile"><b>${cnt("approved")+cnt("picked")+cnt("dispatched")}</b><small>in motion</small></div>
    <div class="tile"><b>${cnt("received")}</b><small>received</small></div></div>`;
}
function listView(u,moves){
  const g=groupByStore(moves),S_=Object.fromEntries(D.stores.map(s=>[s.store_id,s]));
  const order=Object.keys(g).sort((a,b)=>g[b].reduce((x,m)=>x+m.priority_rs,0)-g[a].reduce((x,m)=>x+m.priority_rs,0));
  return order.map(k=>{const L=g[k],st=S_[k],op=GROUPOPEN[k],doneN=L.filter(m=>statusOf(m)!=="proposed").length;
    return `<div class="group"><div class="ghead" data-g="${esc(k)}"><h3>${op?"▾":"▸"} ${esc(k)}</h3><span class="pill">${L.length} lines · ${L.reduce((a,m)=>a+m.units,0)} units${st?` · ${st.tier} · ${st.city} · ${st.fill_now}%→${st.fill_after}%`:""}</span><span class="right pill">${doneN}/${L.length} actioned</span><button class="btn sm" data-all="${esc(k)}">Approve all</button></div>`+
    (op?`<table><tr><th>Move</th><th>Style</th><th class="n">Units</th><th class="n">Value</th><th class="n">Arrives</th><th>State</th><th>Why</th><th></th></tr>${L.map(m=>moveRow(m,u,true)).join("")}</table>`:"")+`</div>`}).join("")||`<div class="panel small">No moves in your view.</div>`;
}
function overviewShell(u,moves,extraTabs){
  const tabs=[["overview","Move list"],["checks","Rule check"],["issues","Data issues"],...(extraTabs||[])];
  const main=document.getElementById("main");
  main.innerHTML=`<nav>${tabs.map(t=>`<button data-tab="${t[0]}" class="${TAB===t[0]?"on":""}">${t[1]}</button>`).join("")}</nav><div id="body"></div>`;
  const body=document.getElementById("body");
  if(TAB==="checks")body.innerHTML=`<div class="panel"><h2>Independent rule check</h2>${C.results.map(r=>`<div style="padding:5px 0;border-top:1px solid var(--line)"><b style="color:${r.passed?"var(--ok)":"var(--bad)"}">${r.passed?"✓":"✗"}</b> ${esc(r.rule)} <span class="small">${r.checked} checked, ${r.violations} broken${r.note?" · "+esc(r.note):""}</span></div>`).join("")}</div>`;
  else if(TAB==="issues")body.innerHTML=`<div class="panel"><h2>Data issues (flagged, not acted on)</h2>${(D.issues||[]).map(i=>`<div style="padding:5px 0;border-top:1px solid var(--line)"><span class="chip">${esc(i.kind)}</span> <b>${esc(i.where)}</b><div class="small">${esc(i.detail)}</div></div>`).join("")||"None."}</div>`;
  else if(TAB==="users")body.innerHTML=usersTab();
  else if(TAB==="audit")body.innerHTML=auditTab();
  else body.innerHTML=problemsPanel()+tiles(moves)+listView(u,moves);
  main.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{TAB=b.dataset.tab;overviewShell(u,moves,extraTabs)});
  body.querySelectorAll(".ghead").forEach(h=>h.onclick=e=>{if(e.target.dataset.all!==undefined)return;const k=h.dataset.g;GROUPOPEN[k]=!GROUPOPEN[k];overviewShell(u,moves,extraTabs)});
  body.querySelectorAll("[data-all]").forEach(b=>b.onclick=e=>{e.stopPropagation();const k=b.dataset.all;const g=groupByStore(moves)[k];g.forEach(m=>{if(statusOf(m)==="proposed"){const a=actions(m,u).find(x=>x[0]==="approve");if(a)setStatus(m,a[1],a[2])}});renderApp()});
  wireActions();bindUserForms();
}
function merchView(u){TAB=TAB==="users"||TAB==="audit"?"overview":TAB;overviewShell(u,visibleMoves(u),[])}
function adminView(u){overviewShell(u,visibleMoves(u),[["users","Users"],["audit","Audit log"]])}

/* ---------- area manager ---------- */
function areaView(u){
  const moves=visibleMoves(u),pend=moves.filter(m=>statusOf(m)==="approved_pending_ho").length;
  const main=document.getElementById("main");
  main.innerHTML=`<div class="panel"><b>Your stores:</b> ${(u.scope.stores||[]).join(", ")} · ${moves.length} moves${pend?` · <span style="color:var(--warn)">${pend} need HO sign-off</span>`:""}</div><div id="body"></div>`;
  document.getElementById("body").innerHTML=problemsPanel()+listView(u,moves);
  main.querySelectorAll(".ghead").forEach(h=>h.onclick=e=>{if(e.target.dataset.all!==undefined)return;const k=h.dataset.g;GROUPOPEN[k]=!GROUPOPEN[k];areaView(u)});
  main.querySelectorAll("[data-all]").forEach(b=>b.onclick=e=>{e.stopPropagation();const g=groupByStore(moves)[b.dataset.all];g.forEach(m=>{if(statusOf(m)==="proposed"){const a=actions(m,u).find(x=>x[0]==="approve");if(a)setStatus(m,a[1],a[2])}});renderApp()});
  wireActions();
}

/* ---------- store manager ---------- */
function storeView(u){
  const mine=new Set(u.scope.stores||[]),W=D.warehouse;
  const incoming=D.moves.filter(m=>mine.has(m.to_loc)),outgoing=D.moves.filter(m=>mine.has(m.from_loc)&&m.from_loc!==W);
  const tbl=(title,rows,note)=>`<div class="panel"><h2>${title} <span class="small">(${rows.length})</span></h2>${rows.length?`<table><tr><th>Move</th><th>Style</th><th class="n">Units</th><th class="n">Arrives</th><th>State</th><th>Why</th><th></th></tr>${rows.map(m=>moveRow(m,u,true)).join("")}</table>`:`<div class="small">${note}</div>`}</div>`;
  document.getElementById("main").innerHTML=`<div class="panel"><b>Store:</b> ${(u.scope.stores||[]).join(", ")}</div>`+tbl("Incoming — receive when it arrives",incoming,"Nothing coming in today.")+tbl("Outgoing — dispatch what head office approved",outgoing,"Nothing to send today.");
  wireActions();
}

/* ---------- warehouse ---------- */
function whView(u){
  const picks=D.warehouse_pick||[];
  const body=picks.map(w=>{
    // moves for this dispatch day from WH
    const dayMoves=D.moves.filter(m=>m.from_loc===D.warehouse&&m.dispatch_on===w.dispatch_on);
    const rows=dayMoves.map(m=>moveRow(m,u,true)).join("");
    return `<div class="panel"><h2>Dispatch ${w.dispatch_on} <span class="small">· ${w.units} units · ${w.lines.length} SKUs · to ${w.to_stores.length} stores</span></h2>
      <table><tr><th>Move</th><th>Style</th><th class="n">Units</th><th class="n">Value</th><th class="n">Arrives</th><th>State</th><th>Why</th><th></th></tr>${rows}</table></div>`;
  }).join("");
  document.getElementById("main").innerHTML=`<div class="panel"><b>Warehouse ${D.warehouse}</b> · pick what head office approved, then dispatch.</div>`+(body||`<div class="panel small">No warehouse dispatches.</div>`);
  wireActions();
}

/* ---------- super admin: users + audit ---------- */
function usersTab(){
  return `<div class="panel"><h2>Users</h2>
    <table><tr><th>Name</th><th>Email</th><th>Role</th><th>Scope</th><th>Active</th><th></th></tr>
    ${S.users.map(u=>`<tr><td><b>${esc(u.name)}</b></td><td class="small">${esc(u.email)}</td>
      <td><select data-urole="${u.user_id}">${ROLES.map(r=>`<option ${u.role===r?"selected":""}>${r}</option>`).join("")}</select></td>
      <td class="small">${u.scope.type==="all"?"everything":u.scope.type==="warehouse"?"warehouse":(u.scope.stores||[]).join(", ")||"—"}</td>
      <td><button class="btn sm" data-utoggle="${u.user_id}">${u.active?"active":"disabled"}</button></td>
      <td><button class="btn sm" data-uscope="${u.user_id}">Scope</button> <button class="btn sm" data-uas="${u.user_id}">View as</button></td></tr>
      ${u._scopeOpen?`<tr><td colspan="6"><div class="scopebox">${D.stores.map(s=>`<label><input type="checkbox" data-sc="${u.user_id}" value="${s.store_id}" ${(u.scope.stores||[]).includes(s.store_id)?"checked":""}> ${s.store_id}</label>`).join("")}</div></td></tr>`:""}`).join("")}
    </table>
    <div class="bar" style="margin-top:12px"><input id="nuName" placeholder="Name"><input id="nuEmail" placeholder="email"><select id="nuRole">${ROLES.map(r=>`<option>${r}</option>`).join("")}</select><button class="btn primary" id="nuAdd">Add user</button></div>
  </div>`;
}
function auditTab(){return `<div class="panel"><h2>Audit log <span class="small">(${S.audit.length})</span></h2>${S.audit.length?S.audit.slice(0,200).map(a=>`<div class="aud"><span class="small">${new Date(a.at).toLocaleString()}</span> · <b>${esc((S.users.find(u=>u.user_id===a.user_id)||{}).name||a.user_id)}</b> · <span class="chip">${esc(a.action)}</span> ${esc(a.target)} <span class="small">${esc(a.detail||"")}</span></div>`).join(""):"<div class='small'>No actions yet.</div>"}</div>`}
function bindUserForms(){
  const q=s=>document.querySelectorAll(s);
  q("[data-urole]").forEach(se=>se.onchange=()=>{const u=S.users.find(x=>x.user_id===se.dataset.urole);u.role=se.value;if(u.role==="warehouse")u.scope={type:"warehouse"};else if(u.role==="merchandiser"||u.role==="super_admin")u.scope={type:"all"};else if(!u.scope.stores)u.scope={type:"stores",stores:[]};persist();log("user_role",u.user_id,"→ "+u.value);overviewShell(me(),visibleMoves(me()),[["users","Users"],["audit","Audit log"]])});
  q("[data-utoggle]").forEach(b=>b.onclick=()=>{const u=S.users.find(x=>x.user_id===b.dataset.utoggle);u.active=!u.active;persist();log("user_active",u.user_id,u.active?"enabled":"disabled");adminView(me())});
  q("[data-uscope]").forEach(b=>b.onclick=()=>{const u=S.users.find(x=>x.user_id===b.dataset.uscope);u._scopeOpen=!u._scopeOpen;adminView(me())});
  q("[data-sc]").forEach(c=>c.onchange=()=>{const u=S.users.find(x=>x.user_id===c.dataset.sc);u.scope={type:"stores",stores:[...document.querySelectorAll(`[data-sc="${u.user_id}"]:checked`)].map(x=>x.value)};persist();log("user_scope",u.user_id,u.scope.stores.join(","))});
  q("[data-uas]").forEach(b=>b.onclick=()=>{S.session=b.dataset.uas;persist();TAB="overview";render()});
  const add=document.getElementById("nuAdd");if(add)add.onclick=()=>{const n=document.getElementById("nuName").value.trim(),e=document.getElementById("nuEmail").value.trim(),r=document.getElementById("nuRole").value;if(!n)return;const u={user_id:uid(),name:n,email:e,role:r,active:true,scope:r==="warehouse"?{type:"warehouse"}:(r==="merchandiser"||r==="super_admin")?{type:"all"}:{type:"stores",stores:[]}};S.users.push(u);persist();log("user_create",u.user_id,n+" ("+r+")");adminView(me())};
}
boot();
</script>
</body>
</html>
